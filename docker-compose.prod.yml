services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aethelgard
      POSTGRES_USER: aethelgard
      POSTGRES_PASSWORD: aethelgard
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aethelgard"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - aethelgard-postgres-prod-data:/var/lib/postgresql/data

  api1: &api-prod-service
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      target: prod
    hostname: api-1
    env_file: .env
    environment: &api-prod-environment
      NODE_ENV: production
      # Override .env's localhost DATABASE_URL for the compose network.
      DATABASE_URL: postgresql://aethelgard:aethelgard@postgres:5432/aethelgard
      JWT_SECRET: ${JWT_SECRET:-dev-only-secret-change-me}
    depends_on:
      postgres:
        condition: service_healthy

  api2:
    <<: *api-prod-service
    hostname: api-2
    environment:
      <<: *api-prod-environment

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      target: prod
    ports:
      - "8080:80"
    depends_on:
      - api1
      - api2

volumes:
  aethelgard-postgres-prod-data:
